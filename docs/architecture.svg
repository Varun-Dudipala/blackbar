<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" role="img" aria-labelledby="title desc">
<title id="title">How Blackbar handles a letter</title>
<desc id="desc">The letter is sealed on the device by pattern checks and Chrome's built-in model (ONLY_ON_DEVICE), which also writes the At a glance summary. Sealed text passes a leak gate before it can go to Gemini in the cloud (ONLY_IN_CLOUD). The answer comes back with placeholders; on the device each statement is checked against the full letter and the real details are put back.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#16140f"/></marker></defs>
<rect width="1200" height="540" fill="#f6f2e9"/>
<rect x="0.5" y="0.5" width="1199" height="539" fill="none" stroke="#cfc6b4"/>
<rect x="24" y="24" width="770" height="492" fill="none" stroke="#16140f" stroke-dasharray="5 5"/>
<text x="44" y="54" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.4" fill="#16140f">ON THIS DEVICE</text><text x="44" y="74" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#524d43">Chrome built-in model · InferenceMode.ONLY_ON_DEVICE</text>
<rect x="864" y="24" width="312" height="492" fill="none" stroke="#16140f" stroke-dasharray="5 5"/>
<text x="884" y="54" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12" font-weight="600" letter-spacing="1.4" fill="#16140f">IN THE CLOUD</text><text x="884" y="74" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#524d43">Gemini · ONLY_IN_CLOUD</text>
<rect x="44" y="120" width="160" height="96" rx="3" fill="#fdfbf6" stroke="#16140f" stroke-width="1.25"/><text x="58" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#16140f">Your letter</text><text x="58" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">Pasted text, or a photo</text><text x="58" y="190" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">read on the device</text>
<rect x="232" y="120" width="172" height="96" rx="3" fill="#fdfbf6" stroke="#16140f" stroke-width="1.25"/><text x="246" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#16140f">Seal</text><text x="246" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">Pattern checks and the</text><text x="246" y="190" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">model find identifiers</text>
<rect x="432" y="120" width="172" height="96" rx="3" fill="#fdfbf6" stroke="#16140f" stroke-width="1.25"/><text x="446" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#16140f">Sealed text</text><text x="446" y="172" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#524d43">Dear</text><rect x="484" y="160" width="62" height="17" rx="2" fill="#16140f"/><text x="490" y="172" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#fbf9f4">NAME 1</text><text x="446" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#524d43">A-number</text><rect x="514" y="186" width="80" height="17" rx="2" fill="#16140f"/><text x="520" y="198" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="11" fill="#fbf9f4">A_NUMBER 1</text>
<rect x="614" y="120" width="164" height="96" rx="3" fill="#fdfbf6" stroke="#b02d14" stroke-width="2"/><text x="628" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#16140f">Leak gate</text><text x="628" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">Stops a request that</text><text x="628" y="190" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">holds a hidden value</text>
<rect x="894" y="120" width="262" height="96" rx="3" fill="#fdfbf6" stroke="#16140f" stroke-width="1.25"/><text x="908" y="150" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#16140f">Gemini</text><text x="908" y="172" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">Explain, checklist, draft reply,</text><text x="908" y="190" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">follow-up questions</text>
<rect x="232" y="320" width="172" height="96" rx="3" fill="#fdfbf6" stroke="#16140f" stroke-width="1.25"/><text x="246" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#16140f">At a glance</text><text x="246" y="372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">Deadline, amounts and</text><text x="246" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">what the letter asks</text>
<rect x="432" y="320" width="172" height="96" rx="3" fill="#fdfbf6" stroke="#16140f" stroke-width="1.25"/><text x="446" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#16140f">What you read</text><text x="446" y="372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">Summary and answers,</text><text x="446" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">with your details</text>
<rect x="614" y="320" width="164" height="96" rx="3" fill="#fdfbf6" stroke="#16140f" stroke-width="1.25"/><text x="628" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#16140f">Checked here</text><text x="628" y="372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">Each statement checked</text><text x="628" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">against the full letter</text>
<rect x="894" y="320" width="262" height="96" rx="3" fill="#fdfbf6" stroke="#16140f" stroke-width="1.25"/><text x="908" y="350" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" fill="#16140f">Answer</text><text x="908" y="372" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">Streamed back with placeholders,</text><text x="908" y="390" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#524d43">never with your values</text>
<line x1="204" y1="168" x2="230" y2="168" stroke="#16140f" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="404" y1="168" x2="430" y2="168" stroke="#16140f" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="604" y1="168" x2="612" y2="168" stroke="#16140f" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="778" y1="168" x2="892" y2="168" stroke="#16140f" stroke-width="1.5" marker-end="url(#a)"/>
<text x="829" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#524d43">sealed</text><text x="829" y="212" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#524d43">text only</text>
<line x1="318" y1="216" x2="318" y2="318" stroke="#16140f" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="404" y1="368" x2="430" y2="368" stroke="#16140f" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="614" y1="368" x2="606" y2="368" stroke="#16140f" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="1025" y1="216" x2="1025" y2="318" stroke="#16140f" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="894" y1="368" x2="780" y2="368" stroke="#16140f" stroke-width="1.5" marker-end="url(#a)"/>
<text x="829" y="396" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#524d43">still</text><text x="829" y="412" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#524d43">sealed</text>
<text x="44" y="478" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#524d43">Everything inside this box stays on the computer and keeps working with no network.</text>
<text x="44" y="498" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#524d43">Your real values never reach the cloud. Answers are checked and restored here.</text>
<text x="884" y="478" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#524d43">Firebase App Check verifies the app</text><text x="884" y="498" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#524d43">before Gemini accepts a request.</text>
</svg>
